name: Build Windows installer

# Builds a Win64 NSIS installer (.exe) via mingw-w64 cross-compilation,
# the same toolchain used by upstream Bitcoin Core/Knots Windows releases.
# Runs on a Linux GitHub-hosted runner -- no local WSL/Windows setup needed.
#
# Trigger it manually from the Actions tab ("Run workflow"), or let it run
# automatically on pushes to main. Either way, the finished .exe shows up
# as a downloadable "artifact" on the workflow run's summary page.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

# Cancel any older in-progress run for the same branch when a new one starts,
# so pushes don't queue up multiple multi-hour builds.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake curl make patch \
            bison g++ pkgconf python3 xz-utils \
            g++-mingw-w64-x86-64-posix \
            nsis

      # depends/ compiles Boost, libevent, Qt, SQLite, etc. from source for
      # the mingw-w64 target. This is by far the slowest step.
      - name: Cache depends build
        uses: actions/cache@v4
        with:
          path: depends/built
          key: depends-win64-${{ hashFiles('depends/packages/*.mk', 'depends/Makefile') }}

      - name: Build dependency tree (x86_64-w64-mingw32)
        run: make -C depends HOST=x86_64-w64-mingw32 -j$(nproc)

      - name: Configure
        run: cmake -B build --toolchain depends/x86_64-w64-mingw32/toolchain.cmake

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package Windows installer
        run: cmake --build build --target deploy

      - name: Locate installer output
        id: find_exe
        run: |
          exe_path=$(find build -maxdepth 2 -iname "*win64-setup*.exe" | head -n1)
          if [ -z "$exe_path" ]; then
            echo "No installer .exe found under build/ -- see the 'Package Windows installer' step's log above." >&2
            exit 1
          fi
          echo "exe_path=$exe_path" >> "$GITHUB_OUTPUT"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bit-block-win64-setup
          path: ${{ steps.find_exe.outputs.exe_path }}
          retention-days: 14

      # This build is NOT PGP-signed -- that requires your own private key,
      # which should never be stored in CI secrets or an Actions log. Sign
      # the downloaded artifact yourself, locally, if you want to publish it:
      #   gpg --detach-sign --armor bit-block-*-win64-setup.exe
